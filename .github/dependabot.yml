---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    open-pull-requests-limit: 10
    # Non-major bumps merge unreviewed and then run in the release job. A
    # week gives a bad upstream release time to be caught.
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: Etc/UTC
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
