---
name: build

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build x86-64
        run: build/build.sh x86-64 "ci.${GITHUB_RUN_NUMBER}"

      - name: Smoke test
        run: build/smoke.sh "$(ls tools-*.raw)"
