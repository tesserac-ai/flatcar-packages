---
name: build

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build x86-64
        run: build/build.sh x86-64 "ci.${GITHUB_RUN_NUMBER}"

      - name: Smoke test
        run: build/smoke.sh "$(ls tools-*.raw)"
