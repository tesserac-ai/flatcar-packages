---
name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - extensions/**
      - build/**
      - examples/tools.transfer
      - examples/noop.transfer
      - .github/workflows/release.yaml
  schedule:
    - cron: "0 5 * * 5" # Fridays 05:00 UTC

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up qemu for arm64 emulation
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      - name: Build both architectures
        run: |
          version="$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          build/build.sh x86-64 "${version}"
          build/build.sh arm64 "${version}"
          sha256sum tools-*.raw > SHA256SUMS

      - name: Smoke test
        run: build/smoke.sh "tools-${VERSION}-x86-64.raw"

      - name: Publish rolling release if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp examples/tools.transfer examples/noop.transfer .

          # Images build reproducibly: equal hashes mean hosts would get the
          # same bytes under a new version and flag a reboot for nothing. The
          # dpkg manifest can't tell: emacs pulls in toolchain packages that
          # never reach the image but change with every kernel update.
          # Hosts fetch transfers only at first boot, so they update in place.
          # A failed lookup or download aborts rather than publish and reboot.
          prev="$(mktemp -d)"
          releases="$(gh release list --json tagName -q '.[].tagName')"
          if [ "${GITHUB_EVENT_NAME}" != workflow_dispatch ] && grep -qx tools <<<"${releases}"; then
            gh release download tools -D "${prev}" -p SHA256SUMS -p tools.transfer -p noop.transfer
          fi
          if [ -e "${prev}/SHA256SUMS" ] \
            && cmp -s <(cut -d' ' -f1 SHA256SUMS) <(cut -d' ' -f1 "${prev}/SHA256SUMS"); then
            if cmp -s tools.transfer "${prev}/tools.transfer" \
              && cmp -s noop.transfer "${prev}/noop.transfer"; then
              echo "nothing changed since the last release"
              exit 0
            fi
            gh release upload tools tools.transfer noop.transfer --clobber
            echo "images unchanged; updated the transfers in place"
            exit 0
          fi

          # Unversioned copies give Ignition a download URL that never rotates.
          for a in x86-64 arm64; do cp "tools-${VERSION}-${a}.raw" "tools-${a}.raw"; done
          gh release delete tools --cleanup-tag --yes 2>/dev/null || true
          gh release create tools \
            --title "tools (rolling)" \
            --notes "Rolling tools sysext. Latest build: ${VERSION}." \
            tools-*.raw SHA256SUMS tools.transfer noop.transfer MANIFEST-*
